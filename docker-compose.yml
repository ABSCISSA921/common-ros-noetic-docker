services:
  ros1:
    build:
      context: .
      args:
        HOST_HOME_DIR: ${HOST_HOME_DIR:-/home/hyd}
    container_name: ros1_noetic_dev
    network_mode: "host"
    privileged: true
    command: tail -f /dev/null
    devices:
      - /dev/dri:/dev/dri
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - XCURSOR_THEME=Adwaita
      - XCURSOR_SIZE=24
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all
      - HTTP_PROXY=http://127.0.0.1:7897
      - HTTPS_PROXY=http://127.0.0.1:7897
      - ALL_PROXY=socks5://127.0.0.1:7897
      - NO_PROXY=localhost,127.0.0.1,::1
    volumes:
      # 映射 XWayland 图形套接字
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${HOST_HOME_DIR:-/home/hyd}:${HOST_HOME_DIR:-/home/hyd}:rw
      # 持久化 VS Code Server，避免每次重建容器重复下载安装
      - vscode-server-data:/root/.vscode-server
      - vscode-extensions:/root/.vscode/extensions
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
volumes:
  vscode-server-data:
  vscode-extensions:
